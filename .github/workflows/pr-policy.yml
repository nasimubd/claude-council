name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate title and body sections
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9._/-]+\))?: [a-z][^[:space:]].*' || { echo 'PR title must use a specific Conventional Commit'; exit 1; }
          for section in Summary Problem Implementation Validation Risks 'Extended description after merge'; do
            echo "$BODY" | grep -Fq "## $section" || { echo "Missing section: $section"; exit 1; }
          done
